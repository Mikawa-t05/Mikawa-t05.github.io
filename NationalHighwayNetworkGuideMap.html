<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全国国道網便覧マップ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        .route-link {
            display: block;
            margin: 4px 0;
            cursor: pointer;
            color: blue;
            text-decoration: underline;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        .full-screen {
            width: 100vw;
            height: 100vh;
            background-color: lightblue;
        }
    </style>
</head>

<body>
    <!-- 背景レイヤー切り替え -->
    <select id="layerSelector" style="position: absolute; z-index: 1000; top: 10px; right: 10px;">
        <option value="pale">航空写真</option>
        <option value="white">白地図</option>
        <option value="picture">淡色地図</option>
    </select>

    <!-- 路線種別切り替え -->
    <select id="routeTypeSelector" style="position: absolute; z-index: 1000; top: 35px; right: 10px;">
        <option value="all">全て</option>
        <option value="expwyOnly">自動車専用道路のみ</option>
        <option value="notExpwy">一般道のみ</option>
        <option value="tollOnly">有料のみ</option>
        <option value="nonToll">有料以外</option>
        <option value="dghOnly">直管国道のみ</option>
        <option value="subsidOnly">補助国道のみ</option>
    </select>

    <div id="map" class="full-screen"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>

        /* ===============================
           Map
        ================================ */
        const map = L.map('map', {
            preferCanvas: true
        }).setView([35.684036, 139.774467], 13);

        /* ===============================
           Base layers
        ================================ */
        const layers = {
            pale: L.tileLayer(
                'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',
                { maxZoom: 18 }
            ),
            white: L.tileLayer(
                'https://cyberjapandata.gsi.go.jp/xyz/blank/{z}/{x}/{y}.png'
            ),
            picture: L.tileLayer(
                'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',
                { maxZoom: 8 }
            )
        };

        let currentLayer = layers.pale.addTo(map);

        document.getElementById('layerSelector').addEventListener('change', e => {
            map.removeLayer(currentLayer);
            currentLayer = layers[e.target.value].addTo(map);
        });

        /* ===============================
           Style definitions (再利用)
        ================================ */
        const styles = {
            tollDGH: { color: '#8856D0', weight: 4 },
            toll: { color: '#B17CFF', weight: 3 },
            dgh: { color: '#EC1B24', weight: 3 },
            sub: { color: '#EA86B7', weight: 2 }
        };

        const highlightStyle = { color: 'cyan', weight: 5 };

        /* ===============================
           Feature data
        ================================ */
        let allFeatures = [];
        let geojsonLayer = null;
        let outlineLayer = null;
        let lastHighlightKey = null;

        /* ===============================
           Load GeoJSON
        ================================ */
        fetch('route.geojson')
            .then(res => res.json())
            .then(data => {

                allFeatures = data.features.map((f, i) => {
                    f._segmentKey = i;

                    // ★ geometry は初回のみ文字列化
                    f._geometryKey = JSON.stringify(f.geometry.coordinates);

                    return f;
                });

                // 描画順ソート（1回だけ）
                allFeatures.sort((a, b) => getPriority(a) - getPriority(b));

                initLayers(allFeatures);
            });

        /* ===============================
           Priority
        ================================ */
        function getPriority(f) {
            const p = f.properties;
            if (p.toll_road === 1 && p.DGH_Route === 1) return 4;
            if (p.toll_road === 1) return 3;
            if (p.DGH_Route === 1) return 2;
            return 1;
        }

        function getOverlappedFeatures(feature) {
            return allFeatures.filter(f =>
                f._geometryKey === feature._geometryKey
            );
        }

        function sortOverlaps(features) {
            return features.slice().sort((a, b) => {

                // ① DGH_Route === 1 を最優先
                const dghA = a.properties.DGH_Route === 1 ? 0 : 1;
                const dghB = b.properties.DGH_Route === 1 ? 0 : 1;
                if (dghA !== dghB) return dghA - dghB;

                // ② Rd_SortNo（NULL安全）
                const noA = Number.isFinite(a.properties.Rd_SortNo)
                    ? a.properties.Rd_SortNo
                    : Infinity;
                const noB = Number.isFinite(b.properties.Rd_SortNo)
                    ? b.properties.Rd_SortNo
                    : Infinity;

                return noA - noB;
            });
        }
        function getRouteTypeText(p) {
            let text = p.route_type; // 例：一般国道
            if (p.expwy === 1) {
                text += '（自専道）';
            }
            return text;
        }

        /* ===============================
           Style functions
        ================================ */
        function getStyle(f) {
            const p = f.properties;
            if (p.toll_road === 1 && p.DGH_Route === 1) return styles.tollDGH;
            if (p.toll_road === 1) return styles.toll;
            if (p.DGH_Route === 1) return styles.dgh;
            return styles.sub;
        }

        function getOutlineStyle(f) {
            if (f.properties.expwy === 1) {
                return {
                    color: 'black',
                    weight: f.properties.DGH_Route === 1 ? 7 : 6
                };
            }
            return { opacity: 0 };
        }

        /* ===============================
           Initialize layers (1回のみ)
        ================================ */
        function initLayers(features) {

            outlineLayer = L.geoJSON(features, {
                style: getOutlineStyle
            }).addTo(map);

            geojsonLayer = L.geoJSON(features, {
                style: getStyle,
                onEachFeature: onEachRoute
            }).addTo(map);
        }

        /* ===============================
           Each feature click handler
        ================================ */
        function onEachRoute(feature, layer) {

            layer.on('click', e => {

                const overlaps = sortOverlaps(
                    getOverlappedFeatures(feature)
                );

                // ★ 必ず先頭を代表路線とする
                const mainFeature = overlaps[0];

                const popupHTML =
                    generateOverlapPopupHTML(overlaps, mainFeature);

                highlightSegment(feature);

                L.popup()
                    .setLatLng(e.latlng)
                    .setContent(popupHTML)
                    .openOn(map);
            });
        }
        function generateOverlapPopupHTML(overlaps, mainFeature) {

            const p = mainFeature.properties;

            const overlapRoutes = overlaps
                .slice(1) // ★ 代表路線を除外
                .map(f => `
    <a href="Route${f.properties.Rd_SortNo}.html" target="_blank">
        ${f.properties.route_name}
    </a>
`).join('<br>・');

            return `
    <table>
        <tr>
            <td><strong>路線名</strong></td>
            <td><a href="Route${p.Rd_SortNo}.html" target="_blank">${p.route_name}</a></td>
        </tr>
        ${p.nick_name ? `
        <tr>
            <td>${p.toll_road === 1 ? '有料区間名' : '通称名'}</td>
            <td>${p.nick_name}</td>
        </tr>
        ` : ''}
        <tr>
            <td>道路の種類</td>
            <td>${getRouteTypeText(p)}</td>
        </tr>
        <tr>
            <td>管理</td>
            <td>${p.DGH_Route === 1 ? '指定区間' : '指定区間外'}</td>
        </tr>
        <tr>
            <td>延長※</td>
            <td>${p.length}m</td>
        </tr>
        </table>
        ${overlapRoutes ? `
                <br><strong>重複区間</strong><br>
                ・${overlapRoutes}
        ` : ''}
    `;
        }
        /* ===============================
           Highlight (差分更新)
        ================================ */
        let lastHighlightSegment = null;

        function highlightSegment(f) {

            // 前回の区間を元に戻す
            if (lastHighlightSegment !== null) {
                geojsonLayer.eachLayer(l => {
                    if (l.feature._segmentKey === lastHighlightSegment) {
                        l.setStyle(getStyle(l.feature));
                    }
                });
            }

            // 今回選択した区間のみ強調
            geojsonLayer.eachLayer(l => {
                if (l.feature._segmentKey === f._segmentKey) {
                    l.setStyle(highlightStyle);
                    l.bringToFront();
                }
            });

            lastHighlightSegment = f._segmentKey;
        }

        /* ===============================
           Filter control
        ================================ */
        document.getElementById('routeTypeSelector')
            .addEventListener('change', e => {

                const type = e.target.value;

                geojsonLayer.eachLayer(l => {
                    const f = l.feature;
                    l.setStyle(
                        filterCheck(f, type)
                            ? getStyle(f)
                            : { opacity: 0 }
                    );
                });

                outlineLayer.eachLayer(l => {
                    const f = l.feature;
                    l.setStyle(
                        filterCheck(f, type)
                            ? getOutlineStyle(f)
                            : { opacity: 0 }
                    );
                });
            });

        function filterCheck(f, type) {

            const p = f.properties;

            switch (type) {
                case 'tollOnly': return p.toll_road === 1;
                case 'nonToll': return p.toll_road !== 1;
                case 'dghOnly': return p.DGH_Route === 1;
                case 'subsidOnly': return p.DGH_Route !== 1;
                case 'expwyOnly': return p.expwy === 1;
                case 'notExpwy': return p.expwy !== 1;
                default: return true;
            }
        }

    </script>
</body>

</html>
