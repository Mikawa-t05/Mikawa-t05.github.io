<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <title>道路データ表示</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        html,
        body,
        #map {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        table {
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 3px 6px;
            text-align: left;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>

        const map = L.map('map').setView(
            [35.684025, 139.774493], 18
        );

        let roadData = null;
        let segmentMaster = {};

        L.tileLayer(
            'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',
            {
                attribution: '国土地理院'
            }
        ).addTo(map);

        const highlightStyle = {
            color: '#00FFFF',
            weight: 6,
            opacity: 1
        };

        const SELECTABLE_ZOOM = 14;
        let selectedLayer = null;
        let selectedPopup = null;

        //--------------------------------------------------
        // segment情報取得
        //--------------------------------------------------

        function getSegmentInfo(feature) {

            const segId =
                String(feature.properties.segment_id);

            return segmentMaster[segId] || null;
        }

        //--------------------------------------------------
        // 線スタイル
        //--------------------------------------------------

        function getRoadStyle(feature) {

            const p =
                getSegmentInfo(feature);

            if (!p) {
                return {
                    color: '#888',
                    weight: 2
                };
            }

            const isExpressway =
                p.road_type === '高速自動車国道';

            const isNationalRoad =
                p.road_type === '一般国道';

            const isToll =
                p.toll_road === 1;

            const isDGH_Route =
                p.DGH_Route === 1;

            if (isExpressway) {
                return {
                    color: isToll ? '#5249A5' : '#FF8E00',
                    weight: 4
                };
            }

            if (isNationalRoad) {

                if (isDGH_Route) {

                    return {
                        color: isToll ? '#8856D0' : '#DA2828',
                        weight: 3
                    };
                }

                return {
                    color: isToll ? '#B17CFF' : '#EA86B7',
                    weight: 2
                };
            }

            return {
                color: isToll ? '#2C8694' : '#888',
                weight: isToll ? 3 : 2
            };
        }

        //--------------------------------------------------
        // 選択解除
        //--------------------------------------------------

        function resetSelection() {

            if (selectedLayer) {

                selectedLayer.setStyle(
                    getRoadStyle(selectedLayer.feature)
                );

                selectedLayer = null;
            }

            if (selectedPopup) {

                map.closePopup(selectedPopup);
                selectedPopup = null;

            }

        }
        //--------------------------------------------------
        // ポップアップ
        //--------------------------------------------------

        function buildPropertyTable(feature) {

            const p =
                getSegmentInfo(feature);

            if (!p) {
                return "<p>データなし</p>";
            }

            const routeName =
                p.route_name || "---";

            const roadType =
                p.road_type || "---";

            const commonName =
                p.nickname || "---";

            const icName =
                p.ic_name;

            const isExpwy =
                p.expwy === 1;

            const isToll =
                p.toll_road === 1;

            const isExpressway =
                p.road_type === "高速自動車国道";

            return `
                <h3>
                    ${commonName === "---"
                    ? routeName
                    : commonName}
                </h3>

                <table>

                    <tr>
                        <th>道路種別</th>
                        <td>${roadType}</td>
                    </tr>

                    <tr>
                        <th>路線名</th>
                        <td>${routeName}</td>
                    </tr>

                    <tr>
                        <th>道路区分</th>
                        <td>
                            ${isExpressway
                    ? (isToll
                        ? "高速自動車国道(有料)"
                        : "高速自動車国道(無料)")
                    : (isExpwy
                        ? (isToll
                            ? "自動車専用道路(有料)"
                            : "自動車専用道路(無料)")
                        : (isToll
                            ? "一般有料道路"
                            : ""))
                }
                        </td>
                    </tr>

                    ${icName
                    ? `
                            <tr>
                                <th>IC名</th>
                                <td>${icName}</td>
                            </tr>
                          `
                    : ''
                }

                </table>
            `;
        }

        //--------------------------------------------------
        // 各地物
        //--------------------------------------------------

        function onEachFeature(feature, layer) {

            layer.on('click', e => {

                // ズーム不足時は完全無効
                if (map.getZoom() < SELECTABLE_ZOOM) {
                    return;
                }

                L.DomEvent.stop(e);

                resetSelection();

                // ハイライト
                layer.setStyle(highlightStyle);

                selectedLayer = layer;

                // ポップアップ生成
                selectedPopup = L.popup({
                    keepInView: false,
                    autoPan: true,
                    autoPanPadding: [30, 30]
                })
                    .setLatLng(e.latlng)
                    .setContent(
                        buildPropertyTable(feature)
                    )
                    .openOn(map);

            });

        }

        map.on(
            'click',
            resetSelection
        );

        //--------------------------------------------------
        // データ読込
        //--------------------------------------------------

        //--------------------------------------------------
        // Pane作成（表示順位固定）
        //--------------------------------------------------

        map.createPane('outline');
        map.createPane('sub');
        map.createPane('semi');
        map.createPane('exp');

        map.getPane('outline').style.zIndex = 450;
        map.getPane('sub').style.zIndex = 460;
        map.getPane('semi').style.zIndex = 470;
        map.getPane('exp').style.zIndex = 480;
        //--------------------------------------------------
        // データ読込
        //--------------------------------------------------

        Promise.all([

            fetch('segment_master.json')
                .then(r => r.json()),

            fetch('expwy_R6.geojson')
                .then(r => r.json()),

            fetch('expressway_R6.geojson')
                .then(r => r.json()),

            fetch('semihighway_R6.geojson')
                .then(r => r.json()),

            fetch('subhighway_R6.geojson')
                .then(r => r.json())

        ]).then(([
            master,
            expwyData,
            expresswayData,
            semiHighwayData,
            subHighwayData
        ]) => {
            segmentMaster = master;

            //--------------------------------
            // 自動車専用道路アウトライン
            //--------------------------------

            const expwyOutlineLayer =
                L.geoJSON(expwyData, {
                    pane: 'outline',

                    style: {
                        color: '#000000',
                        weight: 8,
                        opacity: 1
                    },

                    smoothFactor: 4,

                    interactive: false

                });

            //--------------------------------
            // 自動車専用道路
            //--------------------------------

            const expresswayLayer =
                L.geoJSON(expresswayData, {

                    pane: 'exp',

                    style: getRoadStyle,

                    smoothFactor: 4,

                    onEachFeature

                });

            //--------------------------------
            // 主要道路
            //--------------------------------

            const semiHighwayLayer =
                L.geoJSON(semiHighwayData, {

                    pane: 'semi',

                    style: getRoadStyle,

                    smoothFactor: 3,

                    onEachFeature

                });

            //--------------------------------
            // その他道路
            //--------------------------------

            const subHighwayLayer =
                L.geoJSON(subHighwayData, {

                    pane: 'sub',

                    style: getRoadStyle,

                    smoothFactor: 2,

                    onEachFeature

                });

            //--------------------------------
            // 初期表示
            //--------------------------------

            expresswayLayer.addTo(map);

            updateLayer();

            //--------------------------------
            // ズーム制御
            //--------------------------------

            function updateLayer() {

                const zoom = map.getZoom();

                // 自動車専用道路の縁
                if (zoom >= 11) {

                    if (!map.hasLayer(expwyOutlineLayer))
                        expwyOutlineLayer.addTo(map);

                } else {

                    if (map.hasLayer(expwyOutlineLayer))
                        map.removeLayer(expwyOutlineLayer);
                }

                // 主要道路
                if (zoom >= 7) {

                    if (!map.hasLayer(semiHighwayLayer))
                        semiHighwayLayer.addTo(map);

                } else {

                    if (map.hasLayer(semiHighwayLayer))
                        map.removeLayer(semiHighwayLayer);
                }

                // その他道路
                if (zoom >= 9) {

                    if (!map.hasLayer(subHighwayLayer))
                        subHighwayLayer.addTo(map);

                } else {

                    if (map.hasLayer(subHighwayLayer))
                        map.removeLayer(subHighwayLayer);
                }
            }
            updateLayer();

            map.on(
                'zoomend',
                updateLayer
            );

        })
            .catch(console.error);
    </script>

</body>

</html>
